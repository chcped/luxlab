server {
    listen 443 ssl;
    server_name activity.luxlab.net.br;
    ssl_certificate /etc/letsencrypt/live/activity.luxlab.net.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/activity.luxlab.net.br/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
