# Backend e TURN: docker compose up -d --build
include:
  - compose.turn.yml
services:
  backend:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    env_file: .env
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:8080:8080"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    volumes:
      - luxlab-data:/app/data
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
volumes:
  luxlab-data:
