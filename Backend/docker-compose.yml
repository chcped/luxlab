# Execute preferencialmente: docker compose -f ../compose.yml up -d --build
services:
  backend:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
